<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario responsivo - Clase 1</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <h1>Formulario responsivo</h1>
    <p>Ejercicio de CSS - Programación en Ambientes de Redes</p>

    <form action="" method="post">

        <fieldset>
            <legend>Datos del alumno</legend>

            <div class="campos">

                <p class="campo">
                    <label for="nombre">Nombre y apellido</label>
                    <input type="text" id="nombre" name="nombre" minlength="3" maxlength="60" required>
                </p>

                <p class="campo">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" required>
                </p>

                <p class="campo">
                    <label for="legajo">Legajo</label>
                    <input type="number" id="legajo" name="legajo" min="1" max="99999" required>
                </p>

                <p class="campo">
                    <label for="telefono">Teléfono</label>
                    <input type="tel" id="telefono" name="telefono"
                           pattern="[0-9]{2,4}-[0-9]{4}-[0-9]{4}"
                           title="Formato: código de área, guión, y el número en dos bloques de cuatro. Por ejemplo 11-1234-5678"
                           placeholder="11-1234-5678" required>
                </p>

                <p class="campo">
                    <label for="clave">Contraseña</label>
                    <input type="password" id="clave" name="clave" minlength="8" required>
                </p>

            </div>

        </fieldset>

        <p class="botones">
            <button type="submit">Enviar</button>
            <button type="reset">Borrar</button>
        </p>

    </form>

    <hr>

    <p><a href="../">Volver al índice</a></p>

</body>
</html>
